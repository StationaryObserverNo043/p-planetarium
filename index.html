sheet(`<div class=big style="color:${hex(AX[s.ax].c)}">${AX[s.ax].e} ${AX[s.ax].n}</div><p class=w>${esc(s.text)}</p><p class=m>活動：${esc(a?a.label:'')}</p>${near.length?`<p class=m>この星と近い星</p><div class=r>${near.map(chip).join('')}</div>`:''}${sm.length?`<p class=m>同じ活動から生まれた星</p><div class=r>${sm.map(chip).join('')}</div>`:''}<div class=ac><button data-a=edit>✎<br>編集</button><button data-a=link>⟡<br>線でつなぐ</button><button data-a=name>✦<br>星座に名前</button><button data-a=del>✕<br>削除</button></div>`)}
function comp(id){const seen=new Set([id]),q=[id];while(q.length){const c=q.pop();D.links.forEach(l=>{const o=l.a===c?l.b:l.b===c?l.a:null;if(o&&!seen.has(o)){seen.add(o);q.push(o)}})}return[...seen]}
sh.onclick=e=>{const d=e.target.dataset;if(d.i){lv=+d.i;sh.querySelectorAll('.dots i').forEach(i=>i.classList.toggle('on',+i.dataset.i<=lv));return}
if(!e.target.closest('button'))return;if(d.s)return select(d.s);if(d.p)return startAct(d.p,false);const a=d.a;
if(a==='fadd')startAct($('#fi').value,true);else if(a==='next')nextAx(1);else if(a==='skip')nextAx(0);else if(a==='more')pick();else if(a==='close')closeSh();else if(a==='look'){closeSh();try{if(!localStorage.pph){localStorage.pph=1;toast('1本指で回転・2本指で移動とズーム・星をタップで詳細',6000)}}catch{}}
else if(a==='edit'){const s=cur();lv=s.int;sheet(`<p class=m>${AX[s.ax].e} ${AX[s.ax].n}の言葉</p><input id=fi maxlength=40 value="${esc(s.text)}">${dots(s.int)}<div class=r><button class=p data-a=sv>保存</button></div>`)}
else if(a==='sv'){const s=cur();s.text=$('#fi').value.trim()||s.text;s.int=lv;save();select(s.id)}
else if(a==='link'){linkFrom=sel;sel=null;sh.classList.remove('open');build();lkb(1)}
else if(a==='del'){undo=JSON.stringify(D);const id=sel;D.stars=D.stars.filter(s=>s.id!==id);D.links=D.links.filter(l=>l.a!==id&&l.b!==id);D.cons.forEach(c=>c.ids=c.ids.filter(x=>x!==id));D.cons=D.cons.filter(c=>c.ids.length>1);sel=null;save();closeSh();build();toast('星を削除しました',5000,1)}
else if(a==='name'){if(comp(sel).length<2)return toast('まず「線でつなぐ」で星をつなぐと、星座に名前をつけられます',3500);const ex=D.cons.find(c=>c.ids.includes(sel));sheet(`<p class=m>この星座の名前</p><input id=fi maxlength=30 value="${esc(ex?ex.name:'')}" placeholder="例：一人時間の星座"><div class=r><button class=p data-a=svc>保存</button></div>`)}
else if(a==='svc'){const n=$('#fi').value.trim(),ids=comp(sel),ex=D.cons.find(c=>c.ids.includes(sel));if(n){if(ex){ex.name=n;ex.ids=ids}else D.cons.push({id:uid(),name:n,ids});save();toast('星座に名前をつけました')}select(sel)}
else if(a==='exp'){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='my-planetarium.json';l.click()}
else if(a==='wipe'){if(confirm('すべての星を削除します。元に戻せません。')){D={v:1,acts:[],stars:[],links:[],cons:[]};save();closeSh();build();pick()}}};
$('#add').onclick=pick;
$('#bc').onclick=()=>{const L=D.cons.map(c=>({n:c.name,ids:c.ids.filter(i=>D.stars.some(s=>s.id===i))})).filter(c=>c.ids.length);
sheet(`<p class=w>星座</p>${L.length?L.map(c=>`<button class=c data-s="${c.ids[0]}">${esc(c.n)}（${c.ids.length}）</button>`).join(' '):'<p class=m>星をタップ →「線を引く」で星をつなぐと、その星座に名前をつけられます。</p>'}`)};
$('#bm').onclick=()=>sheet(`<p class=w>設定</p><p class=m>データはこの端末にだけ保存されています。</p><div class=r><button data-a=exp>書き出し（JSON）</button><button data-a=wipe>すべて削除</button></div>`);
$('#bf').onclick=()=>{closeSh();$('#fin').classList.add('on')};$('#fin').onclick=()=>$('#fin').classList.remove('on');
$('#tg').innerHTML='<button data-x=all>全部</button>'+AX.map((x,i)=>`<button data-x=${i}>${x.e} ${x.n}</button>`).join('');
function chips(){[...$('#tg').children].forEach(b=>{const a=b.dataset.x==='all',on=a?vis.every(Boolean):vis[+b.dataset.x];b.style.opacity=on?1:.35;b.style.borderColor=on&&!a?hex(AX[+b.dataset.x].c):''})}
$('#tg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset.x;if(x==='all')vis.fill(1);else{const i=+x;if(vis.every(Boolean))vis.fill(0),vis[i]=1;else vis[i]^=1;if(!vis.some(Boolean))vis.fill(1)}chips();build()};chips();
sh.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=sh.querySelector('.p');b&&b.click()}});
$('#go').onclick=()=>{$('#ti').classList.add('h');if(!D.stars.length)setTimeout(pick,500)};
build();if(D.stars.length)$('#go').textContent='星空を見る';
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
